services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - db-data:/data
      - /Users/loicmarcos/personal-dev/notion-agent-hive:/workspaces/user-data/code
    environment:
      - DATABASE_URL=sqlite:////data/routines.db
      - WORKSPACES_DIR=/workspaces/user-data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_DEV=${VITE_DEV:-}
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  workspaces:
